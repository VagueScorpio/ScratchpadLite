# Who remembers to update this project's dependencies: the build workflow's
# actions, and the NuGet packages.
#
# The actions in build.yml are pinned to commit SHAs rather than to floating
# major tags (v7, v6), so nothing moves under us - and nothing moves on its own
# either. A pinned SHA is frozen until somebody deliberately changes it, which
# means the version that is safe today is the version with a known hole in it
# in eighteen months. Floating tags heal themselves under neglect; pinned SHAs
# rot under neglect.
#
# This file is the thing that remembers. It runs on GitHub's side, not on this
# PC and not in any editor session, so it does not depend on anybody keeping a
# runtime upgrade in their head. Dependabot understands SHA pins: it rewrites
# both the SHA and the trailing "# v3.0.4" comment, so pinning costs nothing to
# maintain once this file exists.
#
# It is configuration, not a program. Nothing is installed and nothing runs
# here, so the "C# and PowerShell only" rule in Section 0 is untouched.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

    # One pull request with all of them rather than one per action. The work in
    # reviewing these is reading each release's notes to see whether a major
    # bump changes behaviour, and that reads better as one diff than as four.
    groups:
      actions:
        patterns:
          - "*"

    # A pull request, never a push. Every bump gets looked at before it can run
    # with this repository's contents: write token.
    open-pull-requests-limit: 5

  # NuGet. The project rules no longer ask for a licence check before a package
  # goes in, so a bump here is an ordinary change: read the release notes, run
  # the tests, look at what it does to startup and to the size of the .exe.
  #
  # The project folders are named one by one rather than letting Dependabot
  # find them from the solution: ScratchpadLite.slnx is the new XML solution
  # format, and nothing here depends on whether Dependabot can read it yet.
  - package-ecosystem: nuget
    directories:
      - /src/ScratchpadLite.Core
      - /src/ScratchpadLite.App
      - /tests/ScratchpadLite.Core.Tests
      - /tests/ScratchpadLite.App.Tests
    schedule:
      interval: monthly

    # Shipped packages and test-only packages in separate pull requests. A bump
    # to the Open XML SDK can change what a saved .docx looks like and is worth
    # reading carefully; a bump to the test runner is not the same kind of
    # thing, and the two do not belong in one diff.
    groups:
      shipped:
        patterns:
          - DocumentFormat.OpenXml
          - Markdig
          - System.IO.Packaging
      test-only:
        patterns:
          - "xunit*"
          - "Xunit*"
          - Microsoft.NET.Test.Sdk

    open-pull-requests-limit: 5
